<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="420" fill="#f7f8fa"/>
  <text x="40" y="44" font-size="20" font-weight="600" fill="#1f2933">Byte-identical train/test overlap</text>
  <text x="40" y="68" font-size="13" fill="#52606d">Share of test flows whose bytes also appear in train. Six public benchmarks.</text>

  <g font-size="13" fill="#1f2933">
    <text x="40" y="120">ISCXVPN2016</text>
    <text x="40" y="170">ISCXTor2016</text>
    <text x="40" y="220">USTC-TFC2016</text>
    <text x="40" y="270">CICIoT2022</text>
    <text x="40" y="320">CrossPlatform-Android</text>
    <text x="40" y="370">CrossPlatform-iOS</text>
  </g>

  <g>
    <rect x="230" y="100" width="558" height="26" fill="#c9d2dc"/>
    <rect x="230" y="150" width="0" height="26" fill="#2f6f9f"/>
    <rect x="230" y="200" width="587" height="26" fill="#c9d2dc"/>
    <rect x="230" y="250" width="562" height="26" fill="#c9d2dc"/>
    <rect x="230" y="300" width="560" height="26" fill="#c9d2dc"/>
    <rect x="230" y="350" width="564" height="26" fill="#c9d2dc"/>
  </g>

  <g font-size="13" fill="#1f2933">
    <text x="800" y="120">79.9%</text>
    <text x="242" y="170">0%</text>
    <text x="829" y="220">84.1%</text>
    <text x="804" y="270">80.5%</text>
    <text x="802" y="320">80.2%</text>
    <text x="806" y="370">80.8%</text>
  </g>

  <text x="40" y="404" font-size="12" fill="#7b8794">Source: GDNet split audit, 2026-10-24. Exact byte matches, 1600-byte flow format. Tor is the only clean split.</text>
</svg>
