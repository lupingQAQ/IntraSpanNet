[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intraspannet"
version = "0.2.0"
description = "Byte-level traffic classification for security product discovery"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "luping" }]
keywords = ["network-security", "traffic-classification", "open-set-recognition", "mamba", "gdn"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Security",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26",
  "torch>=2.4",
  "dpkt>=1.9",
]

[project.optional-dependencies]
gpu = ["flash-linear-attention>=0.3"]
space = ["gradio>=5.0"]
train = ["scikit-learn>=1.3"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
intraspannet = "intraspannet.cli:main"

[tool.setuptools.packages.find]
include = ["intraspannet*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
